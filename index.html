function animateStats(){
  var host=$("#stats"); if(!host || statsAnimated) return;
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches){ statsAnimated=true; return; }
  if(typeof window.IntersectionObserver!=="function"){ statsAnimated=true; return; }
  var so=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      statsAnimated=true; so.disconnect();
      $$("#stats .v.mono").forEach(function(el){
        var target=parseInt(el.textContent,10); if(isNaN(target)) return;
        var start=performance.now(), dur=900;
        (function step(now){
          var p=Math.min((now-start)/dur,1), e=1-Math.pow(1-p,3);
          el.textContent=Math.round(e*target);
          if(p<1) requestAnimationFrame(step); else el.textContent=target;
        })(start);
      });
    });
  },{threshold:.4});
  so.observe(host);
}
function route(){
  var h=location.hash||"";
  var target = h.indexOf("#admin")===0 ? "admin" : "hub";
  if(target==="admin"){
    if(currentView!=="admin"){
      currentView="admin";
      $("#hub-view").classList.add("hidden"); $("#admin-view").classList.remove("hidden");
      closeMega(); closeDrawer(); window.scrollTo(0,0);
    }
    renderAdmin(); paintIcons();
  } else {
    if(currentView!=="hub"){
      currentView="hub";
      $("#admin-view").classList.add("hidden"); $("#hub-view").classList.remove("hidden");
      renderHub();
    }
    if(h && h!=="#"){
      setTimeout(function(){
        var el=null;
        try{ el=document.querySelector(h); }catch(e){}
        if(!el && h.indexOf("#cat-")===0) el=document.querySelector("#directory");
        if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      },70);
    }
  }
}

/* =========================================================================
   EVENTS
   ========================================================================= */
function dispatch(act,el){
  switch(act){
    case "open-search": openSearch(); break;
    case "close-search": closeSearch(); break;
    case "toggle-lang": toggleLang(); break;
    case "set-lang": setLang(el.getAttribute("data-lang")); break;
    case "toggle-theme": toggleTheme(); break;
    case "toggle-mega": toggleMega(); break;
    case "toggle-drawer": toggleDrawer(); break;
    case "close-drawer": closeDrawer(); break;
    case "close-mega": closeMega(); break;
    case "goto": gotoAnchor(el.getAttribute("data-target")); break;
    case "shortcuts": openShortcuts(); break;
    case "export": doExport(); break;
    case "import": doImport(); break;
    case "reset": doReset(); break;
    case "request": openRequest(); break;
    case "request-copy": requestCopy(); break;
    case "request-mail": requestMail(); break;
    case "contact": openContact(); break;
    case "print": window.print(); break;
    case "to-top": toTop(); break;
    case "filter-type": dirFilter.type=el.getAttribute("data-type"); renderDirSection(); break;
    case "filter-clear": dirFilter.type="all"; dirFilter.q=""; renderDirSection(); break;
    case "set-view": setView(el.getAttribute("data-view")); break;
    case "login": tryLogin(); break;
    case "add-res": openResForm(null); break;
    case "add-cat": openCatForm(null); break;
    case "save-res": saveRes(); break;
    case "save-cat": saveCat(); break;
    case "save-brand": saveBrand(); break;
    case "save-pwd": savePwd(); break;
    case "close-modal": closeModal(); break;
  }
}
document.addEventListener("click",function(e){
  var cp=e.target.closest("[data-copy]");
  if(cp){ e.preventDefault(); e.stopPropagation(); copyResLink(cp.getAttribute("data-copy")); return; }
  var ce=e.target.closest("[data-copyemail]");
  if(ce){ e.preventDefault(); e.stopPropagation(); copyText(state.settings.contactEmail||"", t("copied")); return; }
  var cl=e.target.closest("[data-copylink]");
  if(cl){ e.preventDefault(); e.stopPropagation(); copyText(absUrl(cl.getAttribute("data-copylink")), t("copied")); return; }
  var cn=e.target.closest("[data-copyname]");
  if(cn){ e.preventDefault(); e.stopPropagation();
    var rr=state.resources.find(function(x){return x.id===cn.getAttribute("data-copyname");});
    if(rr) copyText(L(rr.title), t("copied_name")); return; }
  var on=e.target.closest("[data-opennow]");
  if(on){ e.preventDefault(); e.stopPropagation(); doOpen(on.getAttribute("data-opennow")); return; }
  var a=e.target.closest("[data-act]");
  if(a){ e.preventDefault(); e.stopPropagation(); dispatch(a.getAttribute("data-act"),a); return; }
  var open=e.target.closest("[data-open]");
  if(open){ openResource(open.getAttribute("data-open")); return; }
  var lo=e.target.closest("[data-launch-open]"); if(lo){ doOpen(lo.getAttribute("data-launch-open")); return; }
  var lq=e.target.closest("[data-launch-qr]"); if(lq){ var rq=state.resources.find(function(x){return x.id===lq.getAttribute("data-launch-qr");}); if(rq) showQR(rq); return; }
  var lb=e.target.closest("[data-launch-back]"); if(lb){ var rb=state.resources.find(function(x){return x.id===lb.getAttribute("data-launch-back");}); if(rb) openLaunch(rb); return; }
  var lp=e.target.closest("[data-launch-print]"); if(lp){ printQR(lp.getAttribute("data-launch-print")); return; }
  var ld=e.target.closest("[data-launch-download]"); if(ld){ downloadQR(ld.getAttribute("data-launch-download")); return; }
  var po=e.target.closest("[data-palopen]"); if(po){ var id=po.getAttribute("data-palopen"); closeSearch(); openResource(id); return; }
  var pi=e.target.closest(".pal-item"); if(pi){ var pidx=parseInt(pi.getAttribute("data-i"),10); if(palItems[pidx]) palItems[pidx].act(); return; }
  var tab=e.target.closest("[data-tab]"); if(tab){ adminTab=tab.getAttribute("data-tab"); renderAdmin(); return; }
  var er=e.target.closest("[data-editres]"); if(er){ openResForm(er.getAttribute("data-editres")); return; }
  var dr=e.target.closest("[data-delres]"); if(dr){ deleteRes(dr.getAttribute("data-delres")); return; }
  var mru=e.target.closest("[data-moveres-up]"); if(mru){ moveRes(mru.getAttribute("data-moveres-up"),-1); return; }
  var mrd=e.target.closest("[data-moveres-down]"); if(mrd){ moveRes(mrd.getAttribute("data-moveres-down"),1); return; }
  var pn=e.target.closest("[data-pin]"); if(pn){ togglePin(pn.getAttribute("data-pin")); return; }
  var ec=e.target.closest("[data-editcat]"); if(ec){ openCatForm(ec.getAttribute("data-editcat")); return; }
  var dc=e.target.closest("[data-delcat]"); if(dc){ deleteCat(dc.getAttribute("data-delcat")); return; }
  var mcu=e.target.closest("[data-movecat-up]"); if(mcu){ moveCat(mcu.getAttribute("data-movecat-up"),-1); return; }
  var mcd=e.target.closest("[data-movecat-down]"); if(mcd){ moveCat(mcd.getAttribute("data-movecat-down"),1); return; }
  var ip=e.target.closest("[data-icon]");
  if(ip){
    pickedIcon=ip.getAttribute("data-icon");
    var box=document.getElementById("icon-pick");
    if(box){ Array.prototype.forEach.call(box.children,function(b){ b.classList.toggle("on", b.getAttribute("data-icon")===pickedIcon); }); }
    return;
  }
  if(!e.target.closest("#nav")) closeMega();
});
/* hover-intent for the mega menu on pointer devices */
var navEl=document.getElementById("nav");
if(navEl && window.matchMedia && window.matchMedia("(hover:hover)").matches){
  navEl.addEventListener("mouseover",function(e){
    if(e.target.closest("#nav-functions")) toggleMega(true);
    else if(!e.target.closest("#mega")) closeMega();
  });
  navEl.addEventListener("mouseleave",function(){ closeMega(); });

document.addEventListener("input",function(e){
  if(e.target.id==="dir-filter"){
    dirFilter.q=e.target.value;
    renderDirBody(); syncDirClear();
    return;
  }
  if(e.target.id==="pal-search"){ runSearch(e.target.value); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="import-file" && e.target.files && e.target.files[0]){ handleImport(e.target.files[0]); return; }
  if(e.target.id==="dir-sort"){ dirFilter.sort=e.target.value; prefs.sort=dirFilter.sort; savePrefs(); renderDirBody(); }
});
document.addEventListener("keydown",function(e){
  var palOpen=$("#palette-overlay").classList.contains("open");
  var modalOpen=$("#modal-overlay").classList.contains("open");
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
  if((e.metaKey||e.ctrlKey)&&(e.key==="k"||e.key==="K")){ e.preventDefault(); if(palOpen) closeSearch(); else openSearch(); return; }
  if(e.key==="Escape"){
    if(modalOpen){ closeModal(); return; }
    if(palOpen){ closeSearch(); return; }
    if($("#mega").classList.contains("open")){ closeMega(); return; }
    if($("#drawer").classList.contains("open")){ closeDrawer(); return; }
    return;
  }
  if(palOpen){
    if(e.key==="ArrowDown"){ e.preventDefault(); palMove(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); palMove(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); palEnter(); }
    return;
  }
  if(modalOpen) return;
  if(e.key==="/"&&!typing){ e.preventDefault(); openSearch(); return; }
  if(e.key==="?"&&!typing){ e.preventDefault(); openShortcuts(); return; }
  if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.hasAttribute&&e.target.hasAttribute("data-open")){
    e.preventDefault(); openResource(e.target.getAttribute("data-open")); return;
  }
});
/* keep tab focus inside the open dialog */
document.addEventListener("keydown",function(e){
  if(e.key!=="Tab") return;
  var host = $("#modal-overlay").classList.contains("open") ? $("#modal-overlay")
    : ($("#palette-overlay").classList.contains("open") ? $("#palette-overlay") : null);
  if(!host) return;
  var f=host.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])');
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(!host.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});
window.addEventListener("hashchange",route);
var progressBar=document.createElement("div");
progressBar.className="scroll-progress";
progressBar.setAttribute("aria-hidden","true");
document.body.appendChild(progressBar);
function updateScroll(){
  var n=$("#nav"); if(n) n.classList.toggle("scrolled", window.scrollY>8);
  var doc=document.documentElement, max=doc.scrollHeight-doc.clientHeight;
  progressBar.style.width=(max>0?(window.scrollY/max)*100:0)+"%";
  var tt=$("#to-top"); if(tt) tt.classList.toggle("show", window.scrollY>640);
  if(currentView==="hub"){ revealInView(); updateSpy(); }
}
window.addEventListener("scroll",updateScroll,{passive:true});
window.addEventListener("resize",updateScroll,{passive:true});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",revealInView,{passive:true});
  window.visualViewport.addEventListener("scroll",revealInView,{passive:true});
}
document.addEventListener("pointermove",function(e){
  var c=e.target.closest && e.target.closest(".res-card,.func-card,.strip-card");
  if(!c) return;
  var r=c.getBoundingClientRect();
  c.style.setProperty("--mx",(e.clientX-r.left)+"px");
  c.style.setProperty("--my",(e.clientY-r.top)+"px");
},{passive:true});

applyTheme(); applyLang(); paintIcons();
/* follow the operating system while the visitor has not chosen a theme */
try{
  if(!prefs.theme && (state.settings.defaultTheme||"system")==="system" && window.matchMedia){
    var mq=window.matchMedia("(prefers-color-scheme:dark)");
    var onSystemTheme=function(){ theme = mq.matches?"dark":"light"; applyTheme(); };
    if(mq.addEventListener) mq.addEventListener("change",onSystemTheme);
    else if(mq.addListener) mq.addListener(onSystemTheme);
  }
}catch(e){}
route();
updateScroll();
