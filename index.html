<script>
/* Resolve the colour theme before first paint so there is no flash of the wrong scheme. */
(function(){try{
  var p=JSON.parse(localStorage.getItem("bevchain_sc_hub_prefs_v1")||"{}");
  var d=JSON.parse(localStorage.getItem("bevchain_sc_hub_v1")||"{}");
  var t=p.theme||(d.settings&&d.settings.defaultTheme)||"system";
  if(t==="system"||!t){ t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light"; }
  document.documentElement.setAttribute("data-theme",t);
}catch(e){}})();
</script>
<style>
/* ==========================================================================
   Security & Compliance Hub — Enterprise UI
   Design system: tokens → primitives → components → layout → motion
   ========================================================================== */

/* ---- 01. Design tokens -------------------------------------------------- */
:root{
  /* surfaces & ink */
  --paper:#F4F6FA; --surface:#FFFFFF; --surface-2:#FAFBFD; --surface-3:#F0F3F8;
  --ink:#0B1220; --ink-soft:#5A6475; --ink-faint:#8A94A6;
  --line:#E1E6EE; --line-strong:#D2D9E4; --line-soft:#EDF0F5;
  /* brand */
  --navy:#08152F; --navy-2:#0E2451; --navy-3:#17346F;
  --accent:#0E9E96; --accent-2:#0A7F78; --accent-3:#E8A33D;
  --accent-soft:#E3F5F3; --accent-ring:rgba(14,158,150,.30); --accent-ink:#07635E;
  /* status */
  --ok:#16855A; --ok-soft:rgba(22,133,90,.11);
  --warn:#B5761C; --warn-soft:rgba(181,118,28,.12);
  --alert:#C0392F; --alert-soft:rgba(192,57,47,.10);
  --info:#1E5FB4; --info-soft:rgba(30,95,180,.10);
  /* elevation */
  --shadow-1:0 1px 2px rgba(11,18,32,.05), 0 1px 1px rgba(11,18,32,.03);
  --shadow-2:0 1px 2px rgba(11,18,32,.04), 0 8px 20px -6px rgba(11,18,32,.10);
  --shadow-3:0 2px 4px rgba(11,18,32,.04), 0 20px 44px -12px rgba(11,18,32,.18);
  --shadow-4:0 30px 70px -18px rgba(8,21,47,.34), 0 8px 20px -8px rgba(8,21,47,.16);
  --glow:0 0 0 4px var(--accent-soft);
  --grid-line:rgba(11,18,32,.05);
  /* geometry */
  --r-xs:4px; --r-s:6px; --r-m:10px; --r-l:14px; --r-xl:20px; --r-pill:100px;
  --maxw:1240px; --util-h:38px; --nav-h:64px;
  /* motion */
  --ease:cubic-bezier(.22,.61,.36,1); --t:.24s var(--ease); --t-slow:.5s var(--ease);
  /* type */
  --font-display:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-thai:"Noto Sans Thai","Inter",system-ui,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#070B14; --surface:#0D1424; --surface-2:#121B2E; --surface-3:#16203a;
  --ink:#E9EEF8; --ink-soft:#98A3B8; --ink-faint:#6A7488;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16); --line-soft:rgba(255,255,255,.055);
  --navy:#050912; --navy-2:#0B1730; --navy-3:#14265a;
  --accent:#28C8BE; --accent-2:#1FB2A9; --accent-3:#EFB35C;
  --accent-soft:rgba(40,200,190,.13); --accent-ring:rgba(40,200,190,.34); --accent-ink:#7FE3DC;
  --ok:#3ACB90; --ok-soft:rgba(58,203,144,.14);
  --warn:#E2A94F; --warn-soft:rgba(226,169,79,.15);
  --alert:#EE7A73; --alert-soft:rgba(238,122,115,.14);
  --info:#6FA8F5; --info-soft:rgba(111,168,245,.14);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 26px -8px rgba(0,0,0,.55);
  --shadow-3:0 22px 48px -14px rgba(0,0,0,.62);
  --shadow-4:0 34px 80px -20px rgba(0,0,0,.75);
  --grid-line:rgba(255,255,255,.045);
  color-scheme:dark;
}
html[lang="th"]{ --font-display:var(--font-thai); --font-body:var(--font-thai); }

/* ---- 02. Reset & base --------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--font-body);background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
  font-size:15.5px;line-height:1.55;letter-spacing:-.006em;overflow-x:hidden;min-height:100%;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
img,svg{display:block}
ul,ol{list-style:none}
::selection{background:var(--accent-soft);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;letter-spacing:-.022em;line-height:1.15}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum" 1,"ss01" 1}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:8px;left:50%;transform:translate(-50%,-160%);z-index:300;background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:var(--r-m);font-size:13.5px;font-weight:500;box-shadow:var(--shadow-3);transition:transform var(--t)}
.skip-link:focus{transform:translate(-50%,0)}
.skip-link:not(:focus-visible){outline:none}

/* layout primitives */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 32px}
.wrap-narrow{max-width:960px}
.container{width:100%}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.spacer{flex:1}

/* ---- 03. Buttons, badges, chips, misc ---------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;
  border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--ink);
  font-size:13.5px;font-weight:550;letter-spacing:-.005em;white-space:nowrap;
  transition:border-color var(--t),box-shadow var(--t),background var(--t),transform var(--t),color var(--t);
}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-1)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--navy);color:#fff;border-color:transparent;box-shadow:var(--shadow-1)}
.btn.primary svg{color:var(--accent)}
.btn.primary:hover{background:var(--navy-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
html[data-theme="dark"] .btn.primary{background:var(--accent);color:#04231F}
html[data-theme="dark"] .btn.primary svg{color:#04231F}
html[data-theme="dark"] .btn.primary:hover{background:#38D6CB}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
.btn.accent svg{color:#fff}
.btn.accent:hover{background:var(--accent-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent;box-shadow:none}
.btn.outline{background:transparent}
.btn.danger{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 34%,transparent)}
.btn.danger:hover{background:var(--alert-soft);border-color:var(--alert)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:var(--r-s);gap:6px}
.btn.sm svg{width:13px;height:13px}
.btn.lg{height:48px;padding:0 22px;font-size:14.5px;border-radius:var(--r-l)}
.btn.lg svg{width:17px;height:17px}
.btn.block{width:100%}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.kbd{
  font-family:var(--font-mono);font-size:10.5px;font-weight:500;line-height:1;color:var(--ink-soft);
  padding:4px 6px;border-radius:var(--r-xs);background:var(--surface-3);border:1px solid var(--line);
  box-shadow:inset 0 -1px 0 var(--line-strong);white-space:nowrap;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:var(--r-xs);
  border:1px solid transparent;white-space:nowrap;
}
.badge .d{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge.active{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.badge.maintenance{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.badge.new{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent-ring)}
.badge.pin{color:var(--ink-soft);background:var(--surface-3);border-color:var(--line)}
.badge.pin svg{width:11px;height:11px}
.badge.draft{color:var(--ink-faint);background:var(--surface-3);border-color:var(--line)}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:12.5px;font-weight:500;
  transition:border-color var(--t),color var(--t),background var(--t),box-shadow var(--t);
}
.chip svg{width:13px;height:13px}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--shadow-1)}
.chip.on svg{color:var(--accent)}
html[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:#04231F}
html[data-theme="dark"] .chip.on svg{color:#04231F}
.chip .n{font-family:var(--font-mono);font-size:10.5px;opacity:.7}
.chip.ghost{border-style:dashed}
.icon-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-soft);
  transition:color var(--t),border-color var(--t),background var(--t),transform var(--t);
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.icon-btn:active{transform:translateY(.5px)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.plain{border-color:transparent;background:transparent}
.icon-btn.plain:hover{background:var(--surface-3);border-color:transparent}
.icon-btn.sm{width:32px;height:32px;border-radius:var(--r-s)}
.icon-btn.sm svg{width:14px;height:14px}
.mini{
  width:30px;height:30px;flex:0 0 auto;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-soft);
  transition:color var(--t),border-color var(--t),background var(--t);
}
.mini:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.mini.del:hover{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 40%,transparent);background:var(--alert-soft)}
.mini svg{width:14px;height:14px}
.mini[disabled]{opacity:.32;cursor:not-allowed}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hr{height:1px;background:var(--line);border:none}
.label{
  font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);
}

/* ---- 04. Utility bar + navigation -------------------------------------- */
.topbar{position:relative;z-index:70}
.util{
  background:var(--navy);color:#C6D0E2;font-size:12.5px;height:var(--util-h);position:relative;overflow:hidden;
}
html[data-theme="dark"] .util{border-bottom:1px solid var(--line)}
.util::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,transparent),transparent 45%)}
.util-inner{max-width:var(--maxw);margin:0 auto;padding:0 32px;height:100%;display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.util-item{display:inline-flex;align-items:center;gap:8px;color:#C6D0E2;font-size:12.5px;transition:color var(--t);white-space:nowrap}
.util-item svg{width:14px;height:14px;opacity:.8}
button.util-item:hover,a.util-item:hover{color:#fff}
.util-sep{width:1px;height:16px;background:rgba(255,255,255,.16);flex:0 0 auto}
.util-org{font-weight:500;color:#fff;letter-spacing:-.005em}
.util-spacer{flex:1;min-width:8px}
.locale{display:inline-flex;align-items:center;padding:2px;border-radius:var(--r-s);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.locale button{
  font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:#AEB9CD;
  padding:4px 9px;border-radius:4px;transition:background var(--t),color var(--t);
}
.locale button:hover{color:#fff}
.locale button.on{background:rgba(255,255,255,.94);color:var(--navy)}

.nav{
  position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--paper) 82%,transparent);
  backdrop-filter:saturate(1.7) blur(16px);-webkit-backdrop-filter:saturate(1.7) blur(16px);
  border-bottom:1px solid transparent;transition:border-color var(--t),background var(--t),box-shadow var(--t);
}
.nav.scrolled{border-bottom-color:var(--line);background:color-mix(in srgb,var(--paper) 94%,transparent);box-shadow:0 1px 0 rgba(11,18,32,.02),0 8px 24px -20px rgba(11,18,32,.5)}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;padding:0 32px;height:var(--nav-h);
  display:flex;align-items:center;gap:14px;
}
.brand{display:flex;align-items:center;gap:11px;flex:0 0 auto;min-width:0;border-radius:var(--r-m);padding:4px 6px 4px 4px;transition:background var(--t)}
.brand:hover{background:var(--surface-3)}
.brand .mark{
  width:34px;height:34px;border-radius:var(--r-m);background:var(--navy);display:grid;place-items:center;flex:0 0 auto;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(8,21,47,.25);position:relative;overflow:hidden;
}
.brand .mark::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 22% 12%,color-mix(in srgb,var(--accent) 42%,transparent),transparent 62%)}
.brand .mark svg{width:18px;height:18px;color:var(--accent);position:relative}
html[data-theme="dark"] .brand .mark{background:var(--surface-2)}
.brand-tx{display:block;min-width:0;line-height:1.15}
.brand-name{display:block;font-family:var(--font-display);font-size:14.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-org{display:block;font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-org:empty{display:none}
.nav-primary{display:flex;align-items:center;gap:2px;margin-left:14px;min-width:0}
.nav-link{
  position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:var(--r-m);
  font-size:13.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;transition:color var(--t),background var(--t);
}
.nav-link svg{width:13px;height:13px;opacity:.75;transition:transform var(--t)}
.nav-link:hover{color:var(--ink);background:var(--surface-3)}
.nav-link.active{color:var(--ink)}
.nav-link.active::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;border-radius:2px;background:var(--accent)}
.nav-link[aria-expanded="true"]{color:var(--ink);background:var(--surface-3)}
.nav-link[aria-expanded="true"] svg{transform:rotate(180deg)}
.nav-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
.nav-search{
  display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 10px 0 12px;min-width:210px;
  border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);color:var(--ink-faint);font-size:13px;
  transition:border-color var(--t),box-shadow var(--t),background var(--t);
}
.nav-search:hover{border-color:var(--accent-ring);box-shadow:var(--glow)}
.nav-search svg{width:15px;height:15px;color:var(--accent);flex:0 0 auto}
.nav-search .lbl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-search .kbd{margin-left:auto}
.console-link{
  display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--r-m);
  background:var(--navy);color:#fff;font-size:13.5px;font-weight:550;
  transition:background var(--t),box-shadow var(--t),transform var(--t);
}
.console-link svg{width:15px;height:15px;color:var(--accent)}
.console-link:hover{background:var(--navy-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
html[data-theme="dark"] .console-link{background:var(--accent);color:#04231F}
html[data-theme="dark"] .console-link svg{color:#04231F}
html[data-theme="dark"] .console-link:hover{background:#38D6CB}
.nav-toggle{display:none;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-soft)}
.nav-toggle svg{width:16px;height:16px}

/* mega menu */
.mega{
  position:absolute;left:0;right:0;top:100%;padding:0 32px 22px;
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity var(--t),transform var(--t),visibility var(--t);
}
.mega.open{opacity:1;visibility:visible;transform:none}
.mega-panel{
  max-width:var(--maxw);margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);
  box-shadow:var(--shadow-4);overflow:hidden;
}
.mega-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.mega-head .label{color:var(--ink-faint)}
.mega-head .who{font-size:12.5px;color:var(--ink-soft);margin-left:auto}
.mega-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:10px}
.mega-item{
  display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r-m);text-align:left;
  transition:background var(--t);
}
.mega-item:hover{background:var(--surface-3)}
.mega-item .ic{width:34px;height:34px;flex:0 0 auto;border-radius:var(--r-s);display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-2);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.mega-item .ic svg{width:16px;height:16px}
.mega-item .tx{min-width:0}
.mega-item .tt{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.mega-item .tt .n{font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--ink-faint);background:var(--surface-3);border-radius:var(--r-xs);padding:2px 5px}
.mega-item .ts{font-size:12.5px;color:var(--ink-soft);line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mega-foot{display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--surface-2);border-top:1px solid var(--line-soft);flex-wrap:wrap}
.mega-foot .hint{font-size:12.5px;color:var(--ink-soft)}
.mega-foot .spacer{flex:1}
.mega-link{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:550;color:var(--accent-ink)}
.mega-link svg{width:14px;height:14px;transition:transform var(--t)}
.mega-link:hover svg{transform:translateX(3px)}

/* mobile drawer */
.drawer-scrim{position:fixed;inset:0;z-index:96;background:color-mix(in srgb,var(--navy) 46%,transparent);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity var(--t),visibility var(--t)}
.drawer-scrim.open{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,90vw);z-index:97;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-4);display:flex;flex-direction:column;
  transform:translateX(102%);visibility:hidden;transition:transform var(--t-slow),visibility var(--t-slow);
}
.drawer.open{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-body{flex:1;overflow-y:auto;padding:14px}
.drawer-sec+.drawer-sec{margin-top:18px}
.drawer-sec>.label{padding:0 10px 8px;display:block}
.drawer-link{
  display:flex;align-items:center;gap:11px;padding:11px 10px;border-radius:var(--r-m);color:var(--ink);font-size:14px;
  font-weight:500;width:100%;text-align:left;transition:background var(--t)
}
.drawer-link svg{width:16px;height:16px;color:var(--accent-2);flex:0 0 auto}
.drawer-link .n{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
.drawer-link:hover{background:var(--surface-3)}

/* ---- 05. Hero ---------------------------------------------------------- */
.hero{position:relative;overflow:hidden;padding:76px 0 60px;border-bottom:1px solid var(--line-soft)}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:52px 52px;background-position:center top;
  -webkit-mask-image:radial-gradient(115% 78% at 50% 0%,#000 26%,transparent 74%);
  mask-image:radial-gradient(115% 78% at 50% 0%,#000 26%,transparent 74%)}
.hero-glow{position:absolute;z-index:0;top:-240px;left:50%;transform:translateX(-50%);width:900px;height:460px;pointer-events:none;opacity:.9;
  background:radial-gradient(circle,var(--accent-soft),transparent 64%);filter:blur(6px);animation:glowDrift 13s ease-in-out infinite}
@keyframes glowDrift{0%,100%{transform:translateX(-50%) translateY(0) scale(1);opacity:.85}50%{transform:translateX(-50%) translateY(24px) scale(1.06);opacity:1}}
@media (prefers-reduced-motion:reduce){.hero-glow{animation:none}}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
.hero-copy{max-width:640px;padding-top:8px}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);padding:7px 14px;border:1px solid var(--line);
  border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--shadow-1);
}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);animation:pulse 2.6s ease-in-out infinite}
.hero-title{
  font-family:var(--font-display);font-weight:650;letter-spacing:-.038em;line-height:1.03;
  font-size:clamp(2.3rem,4.9vw,3.95rem);margin:24px 0 0;max-width:17ch;text-wrap:balance;
}
html[lang="th"] .hero-title{font-weight:600;letter-spacing:-.012em;line-height:1.22;max-width:26ch;font-size:clamp(1.9rem,4.2vw,3.1rem)}
.hero-title .hl{
  white-space:nowrap;padding-bottom:.04em;
  background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 34%,transparent),color-mix(in srgb,var(--accent) 7%,transparent)) no-repeat left bottom;
  background-size:100% .28em;box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.hero-sub{font-size:clamp(1rem,1.35vw,1.13rem);color:var(--ink-soft);max-width:56ch;margin-top:20px;line-height:1.6}
.hero-cta{display:flex;align-items:center;gap:12px;margin-top:32px;flex-wrap:wrap}
.statusline{
  margin-top:30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);
  padding-top:22px;border-top:1px solid var(--line)
}
.statusline .sep{color:var(--ink-faint);opacity:.5}
.statusline b{color:var(--ink);font-weight:600}
.statusline .live{display:inline-flex;align-items:center;gap:7px;color:var(--ok);font-weight:600}

/* hero side panel = product surface */
.hero-panel{
  position:relative;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);
  box-shadow:var(--shadow-3);overflow:hidden;
}
.hero-panel::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--navy-3));opacity:.9}
.hero-panel .panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface-2)}
.hero-panel .panel-head .tt{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.hero-panel .panel-head .spacer{flex:1}
.hero-panel .panel-head .live-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 26%,transparent);padding:4px 8px;border-radius:var(--r-xs)}
.hero-panel .panel-body{padding:16px 18px 18px}
.hero-panel .panel-sec+.panel-sec{margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft)}
.hero-panel .panel-sec-h{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.hero-panel .panel-sec-h .label{color:var(--ink-faint)}
.hero-panel .panel-sec-h .spacer{flex:1}
.hero-panel .panel-list{display:flex;flex-direction:column;gap:2px}
.hero-panel .panel-item{
  display:flex;align-items:center;gap:11px;padding:10px;border-radius:var(--r-m);width:100%;text-align:left;
  transition:background var(--t)
}
.hero-panel .panel-item:hover{background:var(--surface-3)}
.hero-panel .panel-item .ic{width:32px;height:32px;flex:0 0 auto;border-radius:var(--r-s);display:grid;place-items:center;background:var(--surface-3);color:var(--accent-2);border:1px solid var(--line)}
.hero-panel .panel-item .ic svg{width:15px;height:15px}
.hero-panel .panel-item .tx{min-width:0;flex:1}
.hero-panel .panel-item .tt{font-size:13.5px;font-weight:550;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-panel .panel-item .ts{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.hero-panel .panel-item .go{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
.hero-panel .panel-item .go svg{width:12px;height:12px;opacity:0;transform:translateX(-3px);transition:opacity var(--t),transform var(--t)}
.hero-panel .panel-item:hover .go svg{opacity:1;transform:none}
.hero-panel .panel-foot{display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--surface-2);border-top:1px solid var(--line-soft)}
.hero-panel .panel-foot .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
.hero-panel .panel-foot .spacer{flex:1}
.hero-panel .panel-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;color:var(--accent-ink)}
.hero-panel .panel-link svg{width:13px;height:13px}

/* hero metric grid */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface-2)}
.stat{padding:14px 14px 13px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:none}
.stat .k{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--font-display);font-size:1.85rem;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:6px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.sm{font-size:1.02rem;font-weight:550;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .meta{font-size:11.5px;color:var(--ink-faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- 06. Sections ------------------------------------------------------ */
.section{padding:76px 0 0}
.section.tight{padding-top:56px}
.section.last{padding-bottom:96px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.sec-head .sec-l{min-width:0;max-width:74ch}
.sec-eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent-ink)}
.sec-eyebrow .idx{color:var(--ink-faint)}
.sec-title{font-size:clamp(1.45rem,2.4vw,2.05rem);font-weight:600;letter-spacing:-.03em;margin-top:12px;line-height:1.12}
html[lang="th"] .sec-title{letter-spacing:-.01em;line-height:1.28}
.sec-desc{color:var(--ink-soft);font-size:14.5px;margin-top:10px;max-width:70ch}
.sec-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-count{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.anchor-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-faint);opacity:0;transition:opacity var(--t),color var(--t)}
.sec-head:hover .anchor-link{opacity:1}
.anchor-link:hover{color:var(--accent-ink)}
.anchor-link svg{width:12px;height:12px}
.dir-group-head:hover .anchor-link{opacity:1}
.anchor-link:focus-visible,.dir-group-head:focus-within .anchor-link{opacity:1}
.scroll-x{overflow-x:auto;padding-bottom:12px;margin:0 -4px;padding-left:4px;padding-right:4px;scrollbar-width:thin}
.scroll-x::-webkit-scrollbar{height:8px}
.scroll-x::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-pill)}
.scroll-x::-webkit-scrollbar-track{background:transparent}

/* function (category) overview cards */
.func-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.func-card{
  position:relative;display:flex;flex-direction:column;gap:12px;padding:20px;text-align:left;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);cursor:pointer;
  transition:border-color var(--t),box-shadow var(--t),transform var(--t);
}
.func-card:hover{border-color:var(--accent-ring);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.func-card .ic{
  width:44px;height:44px;border-radius:var(--r-m);display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent-soft),color-mix(in srgb,var(--accent) 6%,transparent));
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-2);
}
html[data-theme="dark"] .func-card .ic{color:var(--accent)}
.func-card .ic svg{width:20px;height:20px}
.func-card .tt{font-size:15.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.func-card .ts{font-size:13px;color:var(--ink-soft);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.func-card .tf{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line-soft)}
.func-card .n{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint)}
.func-card .n b{color:var(--ink);font-weight:600}
.func-card .go{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--accent-ink);display:inline-flex;align-items:center;gap:5px}
.func-card .go svg{width:13px;height:13px;transition:transform var(--t)}
.func-card:hover .go svg{transform:translate(2px,-2px)}

/* most-used strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;scroll-snap-type:x proximity}
.strip-card{
  scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);cursor:pointer;
  transition:border-color var(--t),box-shadow var(--t),transform var(--t);
}
.strip-card:hover{border-color:var(--accent-ring);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.strip-card .rank{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink-faint)}
.strip-card .rank .n{color:var(--ink);background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-xs);padding:1px 5px}
.strip-card .qt{font-size:14.5px;font-weight:600;letter-spacing:-.012em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip-card .qm{display:flex;align-items:center;gap:8px;margin-top:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);min-width:0}
.strip-card .qm svg{width:13px;height:13px;color:var(--accent-2);flex:0 0 auto}
.strip-card .qm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-card .qm .c{margin-left:auto;color:var(--ink-faint);flex:0 0 auto}

/* ---- 07. Directory ----------------------------------------------------- */
.dir-shell{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.dir-toolbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dir-field{position:relative;display:flex;align-items:center;flex:1 1 260px;min-width:200px}
.dir-field svg{position:absolute;left:12px;width:15px;height:15px;color:var(--ink-faint);pointer-events:none}
.dir-field input{
  width:100%;height:40px;padding:0 36px 0 36px;border:1px solid var(--line);border-radius:var(--r-m);
  background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;transition:border-color var(--t),box-shadow var(--t)
}
.dir-field input:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.dir-field input::placeholder{color:var(--ink-faint)}
.dir-field .clear{position:absolute;right:8px;width:24px;height:24px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--ink-faint)}
.dir-field .clear:hover{background:var(--surface-3);color:var(--ink)}
.dir-filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dir-filters .chip{height:30px;font-size:12px}
.dir-view{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.dir-view button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-s);font-size:12.5px;font-weight:500;color:var(--ink-soft);transition:background var(--t),color var(--t)}
.dir-view button svg{width:14px;height:14px}
.dir-view button:hover{color:var(--ink)}
.dir-view button.on{background:var(--navy);color:#fff}
.dir-view button.on svg{color:var(--accent)}
html[data-theme="dark"] .dir-view button.on{background:var(--accent);color:#04231F}
html[data-theme="dark"] .dir-view button.on svg{color:#04231F}
.dir-note{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line-soft);background:var(--surface);font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap}
.dir-note .spacer{flex:1}
.dir-note .mono{color:var(--ink-faint);font-size:11.5px}
.dir-layout{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0}
.dir-rail{border-right:1px solid var(--line);padding:18px 14px;background:var(--surface-2);position:relative}
.rail-sticky{position:sticky;top:calc(var(--nav-h) + 18px)}
.rail-h{padding:0 10px 10px;display:block}
.rail-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-s);text-align:left;
  font-size:13px;color:var(--ink-soft);position:relative;transition:background var(--t),color var(--t)
}
.rail-item svg{width:14px;height:14px;color:var(--ink-faint);flex:0 0 auto;transition:color var(--t)}
.rail-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-item .n{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint)}
.rail-item:hover{background:var(--surface-3);color:var(--ink)}
.rail-item.active{background:var(--surface);color:var(--ink);font-weight:550;box-shadow:var(--shadow-1)}
.rail-item.active svg{color:var(--accent)}
.rail-item.active::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:2.5px;border-radius:2px;background:var(--accent)}
.rail-foot{margin-top:14px;padding:12px 10px 0;border-top:1px solid var(--line)}
.rail-foot .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);line-height:1.7}
.dir-body{padding:24px;min-width:0}
.dir-group+.dir-group{margin-top:38px}
.dir-group-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap;scroll-margin-top:calc(var(--nav-h) + 24px)}
.dir-group-head .gt{display:flex;align-items:center;gap:11px;min-width:0}
.dir-group-head .ic{width:34px;height:34px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-2);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);flex:0 0 auto}
.dir-group-head .ic svg{width:16px;height:16px}
.dir-group-head .tt{font-size:16px;font-weight:600;letter-spacing:-.018em}
.dir-group-head .ts{font-size:12.5px;color:var(--ink-soft);margin-top:2px;max-width:70ch}
.dir-group-head .gc{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);white-space:nowrap}

.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.res-card{
  position:relative;display:flex;flex-direction:column;gap:11px;padding:18px;overflow:hidden;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  transition:border-color var(--t),box-shadow var(--t),transform var(--t)
}
.res-card:hover{border-color:var(--accent-ring);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.res-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res-card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-2));transform:scaleY(0);transform-origin:top;transition:transform var(--t);border-radius:0 3px 3px 0}
.res-card:hover .bar,.res-card:focus-visible .bar{transform:scaleY(1)}
.res-top{display:flex;align-items:flex-start;gap:12px}
.res-ic{width:38px;height:38px;flex:0 0 auto;border-radius:var(--r-m);display:grid;place-items:center;background:var(--surface-3);color:var(--accent-2);border:1px solid var(--line)}
.res-ic svg{width:18px;height:18px}
.res-tx{min-width:0;flex:1}
.res-title{font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.res-title-th{font-family:var(--font-thai);font-size:12px;color:var(--ink-faint);margin-top:2px}
html[lang="th"] .res-title-th{display:none}
.res-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.res-type{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);padding:4px 7px;border:1px solid var(--line);border-radius:var(--r-xs);background:var(--surface-2);white-space:nowrap}
.res-desc{font-size:13px;color:var(--ink-soft);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res-foot{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line-soft);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);min-width:0}
.res-host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.res-acts{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}
.res-acts .mini{opacity:0;transition:opacity var(--t),color var(--t),border-color var(--t),background var(--t)}
.res-card:hover .res-acts .mini,.res-card:focus-within .res-acts .mini{opacity:1}
.res-acts .mini:focus-visible{opacity:1}
.res-go{display:inline-flex;align-items:center;gap:5px;color:var(--accent-ink);font-weight:600}
.res-go svg{width:12px;height:12px}

/* directory table view */
.dir-tbl{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.dir-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 104px 112px 132px 96px;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
.dir-row:last-child{border-bottom:none}
.dir-row.head{background:var(--surface-2);font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.dir-row:not(.head):hover{background:var(--surface-2)}
.dir-row .name{display:flex;align-items:center;gap:11px;min-width:0}
.dir-row .name .ic{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--surface-3);color:var(--accent-2);border:1px solid var(--line);flex:0 0 auto}
.dir-row .name .ic svg{width:15px;height:15px}
.dir-row .nm{font-size:13.5px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-row .sb{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.dir-row .cell{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-row .acts{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.dir-row .acts .mini{opacity:0;transition:opacity var(--t)}
.dir-row:hover .acts .mini,.dir-row:focus-within .acts .mini{opacity:1}
.empty-state{text-align:center;padding:64px 24px;color:var(--ink-faint);grid-column:1/-1}
.empty-state .ic{width:46px;height:46px;border-radius:var(--r-l);background:var(--surface-3);display:grid;place-items:center;margin:0 auto 14px;color:var(--ink-faint)}
.empty-state .ic svg{width:22px;height:22px}
.empty-state h3{font-size:15px;color:var(--ink);margin-bottom:6px}
.empty-state p{font-size:13.5px;max-width:44ch;margin:0 auto 16px}

/* icon slots (every <span data-ic> hosts a 1:1 svg) */
[data-ic],.theme-slot{display:inline-flex;align-items:center;justify-content:center}
[data-ic]>svg,.theme-slot>svg{flex:0 0 auto}
.lang-btn{width:auto;padding:0 11px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.04em}
.nav-spacer{flex:1}
.col-link{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* text set inside <button> cards has to become block level */
.func-card .tt,.hero-panel .panel-item .tx,.hero-panel .panel-item .tt,.hero-panel .panel-item .ts,
.mega-item .tx,.mega-item .tt,.mega-item .ts,.dir-group-head .gt>span,
.res-tx,.res-title{display:block}

/* directory sort control */
.dir-sort{display:inline-flex;align-items:center;gap:8px}
.dir-sort select{
  height:32px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--surface);color:var(--ink-soft);font:inherit;font-size:12.5px;cursor:pointer;
  transition:border-color var(--t),box-shadow var(--t)
}
.dir-sort select:hover{border-color:var(--line-strong)}
.dir-sort select:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
.func-card[disabled]{opacity:.62;cursor:default}
.func-card[disabled]:hover{transform:none;border-color:var(--line);box-shadow:none}
.res-host{flex:1 1 auto}
.res-acts{flex:0 0 auto}

/* pointer-less devices: hover-revealed controls stay visible */
@media (hover:none){
  .res-acts .mini,.dir-row .acts .mini{opacity:1}
  .anchor-link{opacity:1}
  .panel-item .go svg{opacity:1;transform:none}
}
/* native search decoration is replaced by our own clear button */
.dir-field input::-webkit-search-cancel-button,.dir-field input::-webkit-search-decoration{-webkit-appearance:none;appearance:none}
.dir-field input::-ms-clear{display:none}

/* spotlight follows pointer */
.func-card::after,.strip-card::after,.res-card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity var(--t);pointer-events:none;z-index:0;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 62%)
}
.func-card:hover::after,.strip-card:hover::after,.res-card:hover::after{opacity:1}
.func-card>*,.strip-card>*,.res-card>*{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.func-card::after,.strip-card::after,.res-card::after{display:none}}

/* ---- 08. Command palette ----------------------------------------------- */
.overlay{position:fixed;inset:0;z-index:90;display:none}
.overlay.open{display:block}
.overlay .scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--navy) 44%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.palette{position:relative;max-width:660px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);box-shadow:var(--shadow-4);overflow:hidden;animation:rise .22s var(--ease)}
.pal-input{display:flex;align-items:center;gap:13px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pal-input svg{width:19px;height:19px;color:var(--accent);flex:0 0 auto}
.pal-input input{flex:1;border:none;background:none;font-family:var(--font-body);font-size:16.5px;color:var(--ink);letter-spacing:-.015em}
.pal-input input:focus{outline:none}
.pal-input .esc{font-family:var(--font-mono);font-size:10.5px;padding:4px 8px;border-radius:var(--r-xs);background:var(--surface-3);border:1px solid var(--line);color:var(--ink-soft)}
.pal-results{max-height:min(58vh,520px);overflow-y:auto;padding:8px;scrollbar-width:thin}
.pal-results::-webkit-scrollbar{width:8px}
.pal-results::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:var(--r-pill)}
.pal-group{padding:12px 12px 4px;position:sticky;top:0;background:linear-gradient(var(--surface) 62%,transparent);z-index:1}
.pal-group .gl{font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.pal-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-m);cursor:pointer;transition:background var(--t);text-align:left;width:100%}
.pal-item.sel,.pal-item:hover{background:var(--accent-soft)}
.pal-item .pic{width:32px;height:32px;border-radius:var(--r-s);background:var(--surface-3);display:grid;place-items:center;color:var(--accent-2);flex:0 0 auto;border:1px solid var(--line)}
.pal-item.sel .pic{background:var(--accent);color:#fff;border-color:transparent}
.pal-item .pic svg{width:16px;height:16px}
.pal-item .ptx{min-width:0;flex:1}
.pal-item .pi-t{font-size:14px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .pi-s{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .pi-go{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);opacity:0;transition:opacity var(--t);flex:0 0 auto;display:inline-flex;align-items:center;gap:5px}
.pal-item.sel .pi-go{opacity:1}
.pal-empty{padding:52px 20px;text-align:center;color:var(--ink-faint);font-size:13.5px}
.pal-empty .mono{display:block;margin-top:6px;font-size:11.5px;color:var(--ink-faint)}
.pal-foot{display:flex;align-items:center;gap:16px;padding:11px 18px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);background:var(--surface-2);flex-wrap:wrap}
.pal-foot span{display:inline-flex;align-items:center;gap:6px}
.pal-foot kbd{font-family:var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xs);padding:2px 5px;color:var(--ink-soft)}

/* ---- 09. Modal, forms, settings ---------------------------------------- */
.modal-overlay{position:fixed;inset:0;z-index:100;display:none}
.modal-overlay.open{display:block}
.modal-overlay .scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--navy) 48%,transparent);backdrop-filter:blur(5px);animation:fade .18s ease}
.modal{position:relative;max-width:700px;margin:7vh auto 0;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);box-shadow:var(--shadow-4);max-height:86vh;display:flex;flex-direction:column;animation:rise .22s var(--ease)}
.modal-head{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--font-display);font-size:1.15rem;font-weight:600;letter-spacing:-.02em;flex:1;min-width:0}
.modal-head .sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px;font-family:var(--font-body)}
.modal-body{padding:22px;overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.field input,.field textarea,.field select{
  width:100%;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface-2);
  color:var(--ink);font-family:var(--font-body);font-size:14px;transition:border-color var(--t),box-shadow var(--t),background var(--t)
}
.field textarea{height:auto;padding:11px 13px;resize:vertical;min-height:66px;line-height:1.5}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow);background:var(--surface)}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
.field input[type=checkbox]{width:18px;height:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.iconpick button{height:42px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft);transition:all var(--t)}
.iconpick button svg{width:18px;height:18px}
.iconpick button:hover{border-color:var(--accent-ring);color:var(--ink)}
.iconpick button.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:var(--shadow-1)}

/* launch chooser + QR */
.launch-host{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-soft);padding:7px 13px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface-2);margin-bottom:18px}
.launch-host svg{width:14px;height:14px;color:var(--accent-2)}
.launch-choices{display:grid;gap:10px}
.launch-choice{display:flex;align-items:center;gap:15px;text-align:left;padding:16px 17px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface-2);transition:border-color var(--t),box-shadow var(--t),transform var(--t),background var(--t)}
.launch-choice:hover{border-color:var(--accent-ring);box-shadow:var(--shadow-2);transform:translateY(-2px);background:var(--surface)}
.launch-choice .lc-ic{width:46px;height:46px;flex:0 0 auto;border-radius:var(--r-m);background:var(--navy);display:grid;place-items:center}
html[data-theme="dark"] .launch-choice .lc-ic{background:var(--surface-3)}
.launch-choice .lc-ic svg{width:21px;height:21px;color:var(--accent)}
.launch-choice .lc-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.launch-choice .lc-t{font-size:15px;font-weight:600;letter-spacing:-.012em}
.launch-choice .lc-s{font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.qr-view{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 0 2px}
.qr-card{background:#fff;padding:16px;border-radius:var(--r-l);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.qr-card svg{width:236px;height:236px;display:block}
.qr-name{margin-top:16px;font-family:var(--font-display);font-size:1.12rem;font-weight:600;letter-spacing:-.015em;color:var(--ink);max-width:380px;line-height:1.25}
.qr-cap{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.qr-cap svg{width:15px;height:15px}
.qr-url{margin-top:11px;font-size:11.5px;color:var(--ink-faint);word-break:break-all;max-width:380px;line-height:1.5}
.shortcut-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.shortcut-row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line-soft)}
.shortcut-row .sc-t{font-size:13px;flex:1;min-width:0}
.shortcut-row .keys{display:inline-flex;gap:5px}
.shortcut-note{font-size:12.5px;color:var(--ink-soft);margin-top:14px}

/* ---- 10. Toasts, progress, back-to-top --------------------------------- */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:130;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:11px;background:var(--navy);color:#fff;padding:12px 17px;border-radius:var(--r-l);
  font-size:13.5px;box-shadow:var(--shadow-4);animation:rise .26s var(--ease);max-width:min(90vw,520px);
  border:1px solid rgba(255,255,255,.1);pointer-events:auto;
}
html[data-theme="dark"] .toast{background:var(--surface-2);border-color:var(--line-strong)}
.toast svg{width:16px;height:16px;color:var(--accent);flex:0 0 auto}
.scroll-progress{position:fixed;top:0;left:0;height:2.5px;width:0;z-index:200;pointer-events:none;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 10px var(--accent-ring)}
.to-top{
  position:fixed;right:22px;bottom:22px;z-index:80;width:44px;height:44px;border-radius:var(--r-l);
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow-2);display:grid;place-items:center;color:var(--ink-soft);
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity var(--t),transform var(--t),visibility var(--t),color var(--t),border-color var(--t)
}
.to-top.show{opacity:1;visibility:visible;transform:none}
.to-top:hover{color:var(--ink);border-color:var(--accent-ring);box-shadow:var(--shadow-3)}
.to-top svg{width:18px;height:18px}

/* ---- 11. Footer -------------------------------------------------------- */
.footer{background:var(--navy);color:#C4CEE0;margin-top:88px;position:relative;overflow:hidden}
html[data-theme="dark"] .footer{border-top:1px solid var(--line)}
.footer::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 55%,transparent) 50%,transparent)}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:44px;padding:64px 0 0}
.foot-brand .mark{width:40px;height:40px;border-radius:var(--r-m);background:rgba(255,255,255,.07);display:grid;place-items:center;margin-bottom:18px;border:1px solid rgba(255,255,255,.08)}
.foot-brand .mark svg{width:21px;height:21px;color:var(--accent)}
.foot-brand h3{font-family:var(--font-display);font-weight:600;font-size:1.35rem;letter-spacing:-.025em;color:#fff;margin-bottom:12px}
.foot-brand p{font-size:13.5px;color:#98A5BD;max-width:44ch;line-height:1.65}
.foot-brand .foot-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.foot-tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#A8B4CB;
  padding:5px 10px;border-radius:var(--r-s);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09)}
.foot-tag svg{width:12px;height:12px;color:var(--accent)}
.foot-col h4{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#6E7C99;margin-bottom:16px}
.foot-col a,.foot-col button{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#C4CEE0;padding:6px 0;transition:color var(--t),transform var(--t);text-align:left;width:100%}
.foot-col a:hover,.foot-col button:hover{color:#fff}
.foot-col svg{width:14px;height:14px;opacity:.65;flex:0 0 auto}
.foot-col .n{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:#6E7C99}
.foot-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:26px 0;margin-top:52px;border-top:1px solid rgba(255,255,255,.09);flex-wrap:wrap}
.foot-bottom .meta{font-family:var(--font-mono);font-size:11px;color:#7C89A3;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.foot-bottom .meta .sep{opacity:.4}
.foot-bottom .right{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.foot-bottom .locale{background:rgba(255,255,255,.06)}
.foot-legal{font-size:11.5px;color:#6E7C99;padding-bottom:34px;max-width:100ch;line-height:1.7}
.foot-legal a{color:#98A5BD;text-decoration:underline;text-underline-offset:2px}
.foot-legal a:hover{color:#fff}

/* ---- 12. Admin console ------------------------------------------------- */
.admin-top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.admin-top-inner{display:flex;align-items:center;gap:14px;height:64px;max-width:1280px;margin:0 auto;padding:0 32px}
.admin-badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);padding:7px 11px;border:1px solid var(--accent-ring);border-radius:var(--r-s);background:var(--accent-soft)}
.admin-badge svg{width:14px;height:14px}
.admin-wrap{max-width:1280px;margin:0 auto;padding:28px 32px 80px}
.admin-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px;flex-wrap:wrap}
.admin-tab{font-size:13.5px;font-weight:500;color:var(--ink-soft);padding:12px 15px;border-bottom:2px solid transparent;transition:color var(--t),border-color var(--t);margin-bottom:-1px;display:inline-flex;align-items:center;gap:8px;border-radius:var(--r-s) var(--r-s) 0 0}
.admin-tab svg{width:15px;height:15px}
.admin-tab:hover{color:var(--ink);background:var(--surface-3)}
.admin-tab.active{color:var(--accent-ink);border-bottom-color:var(--accent)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.panel-head h2{font-family:var(--font-display);font-size:1.4rem;font-weight:600;letter-spacing:-.025em}
.panel-head p{font-size:13px;color:var(--ink-soft);margin-top:5px;max-width:80ch}
.tbl{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:var(--surface)}
.trow{display:grid;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-soft);transition:background var(--t)}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--surface-2)}
.trow.head{background:var(--surface-2);font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.trow.head:hover{background:var(--surface-2)}
.t-icon{width:32px;height:32px;border-radius:var(--r-s);background:var(--surface-3);display:grid;place-items:center;color:var(--accent-2);border:1px solid var(--line)}
.t-icon svg{width:16px;height:16px}
.t-name{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.t-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-pill{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--r-xs);padding:3px 7px;background:var(--surface-2);text-align:center;font-weight:600}
.t-actions{display:flex;gap:5px;justify-content:flex-end}
.res-row{grid-template-columns:30px minmax(0,1fr) 110px 96px 56px auto}
.cat-row{grid-template-columns:36px minmax(0,1fr) 70px 110px auto}
.cardbox{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:22px;box-shadow:var(--shadow-1)}
.cardbox+.cardbox{margin-top:16px}
.cardbox h3{font-size:14.5px;font-weight:600;letter-spacing:-.012em;margin-bottom:5px}
.cardbox .hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
.an-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.an-stat{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);padding:18px;box-shadow:var(--shadow-1)}
.an-stat .k{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.an-stat .v{font-family:var(--font-display);font-size:1.85rem;font-weight:600;letter-spacing:-.03em;margin-top:8px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 64px;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.bar-row:last-child{border-bottom:none}
.bar-label{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;min-width:0}
.bar-label svg{width:14px;height:14px;color:var(--accent-2);flex:0 0 auto}
.bar-label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:7px;border-radius:var(--r-pill);background:var(--surface-3);margin-top:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s var(--ease)}
.bar-val{font-family:var(--font-mono);font-size:12px;color:var(--ink-soft);text-align:right;font-weight:500}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
.login-bg{position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:52px 52px;
  -webkit-mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent 75%);mask-image:radial-gradient(80% 60% at 50% 40%,#000,transparent 75%)}
.login-card{position:relative;width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);box-shadow:var(--shadow-4);padding:34px 30px;text-align:center}
.login-card .lmark{width:54px;height:54px;border-radius:var(--r-l);background:var(--navy);display:grid;place-items:center;margin:0 auto 20px}
.login-card .lmark svg{width:25px;height:25px;color:var(--accent)}
.login-card h2{font-family:var(--font-display);font-size:1.4rem;font-weight:600;letter-spacing:-.025em;margin-bottom:7px}
.login-card p{font-size:13px;color:var(--ink-soft);margin-bottom:22px}
.login-card .field{text-align:left}
.login-card input{height:46px;text-align:center;font-family:var(--font-mono);letter-spacing:.06em}
.login-card .btn{width:100%;justify-content:center;height:46px;margin-top:4px}
.login-card .err{color:var(--alert);font-size:12.5px;font-family:var(--font-mono);margin-top:14px;min-height:18px}
.login-back{position:absolute;top:24px;left:24px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);padding:8px 12px;border-radius:var(--r-m);transition:color var(--t),background var(--t)}
.login-back:hover{color:var(--ink);background:var(--surface-3)}
.login-back svg{width:15px;height:15px}

/* ---- 13. Reveal motion ------------------------------------------------- */
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ---- 14. Responsive ---------------------------------------------------- */
@media (max-width:1180px){
  .nav-primary{display:none}
  .nav-toggle{display:inline-flex}
  .dir-layout{grid-template-columns:1fr}
  .dir-rail{display:none}
}
@media (max-width:1080px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .hero-copy{max-width:none}
  .hero-panel{max-width:640px}
  .foot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:36px}
  .dir-row{grid-template-columns:minmax(0,1fr) 134px 100px 104px}
  .dir-row .col-dest,.dir-row .col-acts{display:none}
  .res-row{grid-template-columns:30px minmax(0,1fr) 110px 96px auto}
  .res-row .col-pin{display:none}
}
@media (max-width:900px){
  .wrap{padding:0 22px}
  .util-inner,.nav-inner,.admin-wrap,.admin-top-inner{padding-left:22px;padding-right:22px}
  .util{height:auto;min-height:var(--util-h);padding:4px 0}
  .util-inner{flex-wrap:wrap;gap:10px;row-gap:6px;padding-top:6px;padding-bottom:6px;min-height:var(--util-h)}
  .util-spacer{display:none}
  .formgrid{grid-template-columns:1fr}
  .an-grid{grid-template-columns:1fr}
  .iconpick{grid-template-columns:repeat(6,1fr)}
  .mega{display:none !important}
}
@media (max-width:760px){
  body{font-size:15px}
  .hero{padding:52px 0 44px}
  .hero-panel{max-width:none}
  .section{padding-top:56px}
  .nav-search{min-width:0}
  .nav-search .lbl,.nav-search .kbd{display:none}
  .nav-search{width:38px;padding:0;justify-content:center;border-radius:var(--r-m)}
  .console-link span.lbl{display:none}
  .console-link{padding:0 12px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:none}
  .stat:nth-child(3){grid-column:1/-1;border-top:1px solid var(--line)}
  .dir-body{padding:16px}
  .res-grid{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr;gap:30px;padding-top:48px}
  .foot-bottom{margin-top:36px}
  .shortcut-grid{grid-template-columns:1fr}
  .dir-row{grid-template-columns:minmax(0,1fr) 82px;padding:12px 14px}
  .dir-row .col-func,.dir-row .col-status,.dir-row .col-dest,.dir-row .col-acts{display:none}
  .dir-sort .label{display:none}
  .dir-toolbar{padding:12px}
  .toasts{bottom:14px;left:14px;right:14px;transform:none;align-items:stretch}
  .toast{width:100%}
  .to-top{right:14px;bottom:14px}
}
@media (max-width:640px){
  .util-sep,#util-shortcuts{display:none}
  #util-search .kbd{display:none}
  .util-inner{gap:12px}
}
@media (max-width:560px){
  .wrap{padding:0 16px}
  #t-util-search{display:none}
  .util-inner,.nav-inner,.admin-wrap,.admin-top-inner{padding-left:16px;padding-right:16px}
  .grid2{grid-template-columns:1fr}
  .res-row{grid-template-columns:30px minmax(0,1fr) 78px auto}
  .res-row .col-status,.res-row .col-pin{display:none}
  .dir-toolbar{gap:8px}
  .dir-view button span{display:none}
  .dir-view button{padding:0 9px}
  .cat-row{grid-template-columns:36px minmax(0,1fr) auto}
  .cat-row .col-count{display:none}
  .iconpick{grid-template-columns:repeat(5,1fr)}
  .palette{margin:5vh 12px 0;max-width:none}
  .modal{margin:4vh 12px 0;max-width:none}
  .modal-head,.modal-body,.modal-foot{padding-left:16px;padding-right:16px}
  .qr-card svg{width:min(236px,62vw);height:auto}
  .stats{grid-template-columns:1fr 1fr}
  .strip{grid-auto-columns:minmax(220px,84%)}
}
@media (max-width:420px){
  .brand-name{font-size:13.5px;max-width:150px}
  .eyebrow{font-size:9.5px;padding:6px 11px;letter-spacing:.12em}
  .hero-cta .btn.lg{width:100%}
  .stats{grid-template-columns:1fr}
  .stat{border-right:none;border-bottom:1px solid var(--line)}
  .stat:last-child{border-bottom:none}
}

/* ---- 15. Print --------------------------------------------------------- */
@media print{
  .util,.nav,.mega,.footer,.dir-rail,.dir-toolbar,.to-top,.scroll-progress,.drawer,.drawer-scrim,
  .overlay,.modal-overlay,.toasts,.skip-link,.hero-glow,.res-acts,.panel-foot{display:none !important}
  html,body{background:#fff;color:#000}
  .reveal{opacity:1 !important;transform:none !important}
  .hero{padding:0 0 18px;border:none}
  .hero-grid{display:block}
  .hero-title{font-size:26pt;letter-spacing:-.02em}
  .hero-sub{font-size:11pt;color:#333}
  .section{padding-top:22px;break-inside:avoid}
  .res-grid{grid-template-columns:1fr 1fr;gap:10px}
  .dir-layout{display:block}
  .dir-note,.dir-body{padding:0}
  .res-card,.func-card,.dir-shell{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .res-desc{-webkit-line-clamp:4}
  a[href^="http"]::after{content:" (" attr(href) ")";font-family:var(--font-mono);font-size:8pt;color:#666}
}
@media (prefers-contrast:more){
  :root{--line:#B9C1CD;--line-soft:#D2D8E1;--ink-soft:#3D4657;--ink-faint:#5C6577}
  .res-desc,.func-card .ts{color:var(--ink)}
}

var io=null, revealTimers=[];
/* Safety net independent of IntersectionObserver (which can fail to fire the
   initial intersection on iOS Safari, esp. when pinch-zoomed — leaving content
   stuck at opacity:0). Uses getBoundingClientRect, which is always reliable. */
function revealInView(){
  var vh=window.innerHeight||document.documentElement.clientHeight;
  $$(".reveal").forEach(function(el){
    if(el.classList.contains("in")) return;
    var r=el.getBoundingClientRect();
    if(r.top<vh+80 && r.bottom>-80) el.classList.add("in");
  });
}
function observeReveals(){
  if(io){ try{ io.disconnect(); }catch(e){} io=null; }
  try{
    if(typeof window.IntersectionObserver==="function"){
      io = new IntersectionObserver(function(entries){ entries.forEach(function(e){
        if(!e.isIntersecting) return;
        var el=e.target; if(el.classList.contains("in")){ io.unobserve(el); return; }
        var idx=0;
        if(el.parentNode){ var sibs=el.parentNode.children, k=0; for(var i=0;i<sibs.length;i++){ if(sibs[i]===el){ idx=k; break; } if(sibs[i].classList&&sibs[i].classList.contains("reveal")) k++; } }
        var d=Math.min(idx,8)*70; el.style.transitionDelay=d+"ms"; el.classList.add("in");
        (function(node){ setTimeout(function(){ node.style.transitionDelay=""; }, 720+d); })(el);
        io.unobserve(el);
      }); },{threshold:.08,rootMargin:"0px 0px -40px 0px"});
      $$(".reveal").forEach(function(el){io.observe(el);});
    }
  }catch(e){ io=null; }
  // Guarantee above-the-fold content shows immediately, and nothing stays hidden.
  revealInView();
  revealTimers.forEach(clearTimeout); revealTimers=[];
  revealTimers.push(setTimeout(revealInView,350));
  revealTimers.push(setTimeout(revealInView,1200));
  revealTimers.push(setTimeout(function(){ $$(".reveal").forEach(function(el){ el.classList.add("in"); }); },2800));
}

function paletteGroups(q){
  q=(q||"").trim().toLowerCase();
  var cats=sortedCats(), groups=[];
  function match(s){ return !q || String(s).toLowerCase().indexOf(q)>=0; }

  /* recents */
  if(!q){
    var recents=state.resources.slice().filter(function(r){ return state.analytics[r.id]&&state.analytics[r.id].last; })
      .sort(function(a,b){ return (state.analytics[b.id].last||0)-(state.analytics[a.id].last||0); }).slice(0,4);
    if(recents.length){
      groups.push({label:t("pal_recent"), items:recents.map(function(r){
        var c=catOf(r.categoryId);
        return {kind:"res",id:r.id,label:L(r.title),sub:esc(c?L(c.name):"")+" · "+esc(t("types")[r.type]||r.type),ic:c?c.icon:"folder",act:function(){ closeSearch(); openResource(r.id); }};
      })});
    }
  }
  /* actions */
  var allActions=[
    {k:"act_theme",ic:"moon",act:function(){ closeSearch(); toggleTheme(); }},
    {k:"act_console",ic:"lock",act:function(){ closeSearch(); location.hash="#admin"; }},
    {k:"foot_search",ic:"search",act:function(){ closeSearch(); openSearch(); }},
    {k:"act_shortcuts",ic:"keyboard",act:function(){ closeSearch(); openShortcuts(); }},
    {k:"act_export",ic:"download",act:function(){ closeSearch(); doExport(); }},
    {k:"act_print",ic:"print",act:function(){ closeSearch(); window.print(); }},
    {k:"act_lang",ic:"globe",act:function(){ closeSearch(); setLang(lang==="en"?"th":"en"); }},
    {k:"act_top",ic:"arrowUp",act:function(){ closeSearch(); toTop(); }}
  ];
  var acts=allActions.filter(function(a){ return match(t(a.k)); });
  if(acts.length){
    groups.push({label:t("pal_actions"), items:acts.map(function(a){
      return {kind:"act",label:t(a.k),sub:"",ic:a.ic,act:a.act};
    })});
  }
  /* functions */
  var fns=cats.filter(function(c){ return match(L(c.name)) || match(L(c.desc)); });
  if(fns.length){
    groups.push({label:t("pal_funcs"), items:fns.map(function(c){
      return {kind:"cat",id:c.id,label:L(c.name),sub:esc(L(c.desc)),ic:c.icon,act:function(){ closeSearch(); gotoAnchor("#cat-"+c.id); }};
    })});
  }
  /* resources */
  var res=state.resources.filter(function(r){
    var c=catOf(r.categoryId);
    return match(L(r.title))||match(r.title.en)||match(r.title.th)||match(L(r.desc))||match(c?L(c.name):"")||match(hostOf(r.url));
  });
  if(res.length){
    groups.push({label:t("pal_res"), items:res.map(function(r){
      var c=catOf(r.categoryId);
      return {kind:"res",id:r.id,label:L(r.title),sub:esc(c?L(c.name):"")+" · "+esc(t("types")[r.type]||r.type),ic:c?c.icon:"folder",act:function(){ closeSearch(); openResource(r.id); }};
    })});
  }
  return groups;
}
function runSearch(q){
  q=q||"";

  palItems=[];

    if(!g.items.length) return;
    html+='<div class="pal-group"><span class="gl">'+esc(g.label)+'</span></div>';

  box.innerHTML=html;

function copyText(text,okMsg,failMsg){
  function done(ok){ toast(ok?(okMsg||t("copied")):(failMsg||t("copy_failed")), ok?"check":"warn"); }
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ done(true); },function(){ done(fallbackCopy(text)); });
      return;
    }
  }catch(e){}
  done(fallbackCopy(text));
}

  try{
    var ta=document.createElement("textarea");
    ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,ta.value.length);
    var ok=document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
